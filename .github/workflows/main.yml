name: Pipeline DevOps

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Mostrar arquivos do projeto
        run: ls -la

      - name: Verificar Docker
        run: docker --version

      - name: Construir imagem Docker
        run: docker build -t projeto-cloud .

      - name: Testar container
        run: |
          docker run -d -p 8080:80 --name teste projeto-cloud
          sleep 5
          curl http://localhost:8080

      - name: Finalizado
        run: echo "CI executado com sucesso!"

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/agroverde || mkdir ~/agroverde && cd ~/agroverde

            rm -rf *
