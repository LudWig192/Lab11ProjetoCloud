# ─────────────────────────────────────────────────────────────
# GitHub Actions – Pipeline CI/CD · AgroVerde One-Page
# Case 2: Agronegócio · LGPD · Governança de dados
# LAB11 – Projeto Cloud · UNISENAI Jun/2026
# ─────────────────────────────────────────────────────────────
#
# SECRETS necessários no repositório (Settings > Secrets):
#   EC2_HOST       → IP público da instância EC2
#   EC2_USER       → Usuário SSH (ex: ubuntu ou ec2-user)
#   EC2_SSH_KEY    → Chave privada .pem em formato PEM completo
#
# ─────────────────────────────────────────────────────────────

name: CI/CD · AgroVerde Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  # ── JOB 1: CI – Integração Contínua ─────────────────────────
  build-and-test:
    name: 🌱 Build & Validação
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔍 Verificar arquivos obrigatórios
        run: |
          echo "Verificando estrutura do projeto..."
          test -f index.html  && echo "✅ index.html encontrado"    || (echo "❌ index.html ausente" && exit 1)
          test -f Dockerfile  && echo "✅ Dockerfile encontrado"    || (echo "❌ Dockerfile ausente" && exit 1)
          echo "Estrutura validada com sucesso."

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏗️ Build da imagem Docker
        run: |
          docker build -t agroverde-onepage:${{ github.sha }} .
          docker build -t agroverde-onepage:latest .

      - name: 🧪 Smoke test (container sobe e responde HTTP 200)
        run: |
          docker run -d --name agroverde-test -p 8080:80 agroverde-onepage:latest
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080)
          echo "HTTP Status: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Página respondendo corretamente" || (echo "❌ Falha no smoke test" && exit 1)
          docker stop agroverde-test && docker rm agroverde-test

      - name: 📦 Upload do artefato HTML
        uses: actions/upload-artifact@v4
        with:
          name: agroverde-onepage-html
          path: index.html
          retention-days: 30

  # ── JOB 2: CD – Deploy Contínuo na EC2 ──────────────────────
  deploy:
    name: 🚀 Deploy na EC2
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🔐 Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/agroverde.pem
          chmod 600 ~/.ssh/agroverde.pem
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: 📤 Copiar arquivos para a EC2
        run: |
          scp -i ~/.ssh/agroverde.pem \
            index.html Dockerfile \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/${{ secrets.EC2_USER }}/agroverde/

      - name: 🐳 Build e reinicialização do container na EC2
        run: |
          ssh -i ~/.ssh/agroverde.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} bash << 'REMOTE'
            set -e
            cd ~/agroverde
            echo "Construindo imagem..."
            docker build -t agroverde-onepage:latest .
            echo "Parando container anterior..."
            docker stop agroverde 2>/dev/null || true
            docker rm   agroverde 2>/dev/null || true
            echo "Subindo novo container..."
            docker run -d \
              --name agroverde \
              --restart unless-stopped \
              -p 80:80 \
              agroverde-onepage:latest
            echo "Deploy concluído!"
            docker ps | grep agroverde
          REMOTE

      - name: 🩺 Verificação pós-deploy
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.EC2_HOST }}/)
          echo "HTTP Status pós-deploy: $STATUS"
          [ "$STATUS" = "200" ] && echo "✅ Site no ar!" || echo "⚠️  Verificar: http://${{ secrets.EC2_HOST }}"

      - name: 🧹 Limpar chave SSH
        if: always()
        run: rm -f ~/.ssh/agroverde.pem
